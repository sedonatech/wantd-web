<script>
// The language of the page: the first of the browser's languages the app
// speaks (35, as Localizable.xcstrings), English otherwise. Its words come in
// one small file before the page draws; English needs none.
(function () {
  var known = "ar ca cs da de el es es-419 fi fr he hi hr hu id it ja ko ms nb nl pl pt-BR pt-PT ro ru sk sv th tr uk vi zh-Hans zh-Hant".split(" ");
  var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  var pick = "en";
  for (var i = 0; i < langs.length; i++) {
    var l = String(langs[i]).toLowerCase(), base = l.split("-")[0], found = null;
    if (base === "zh") found = /hant|tw|hk|mo/.test(l) ? "zh-Hant" : "zh-Hans";
    else if (base === "pt") found = /br/.test(l) ? "pt-BR" : "pt-PT";
    else if (base === "es") found = (l === "es" || l === "es-es") ? "es" : "es-419";
    else if (base === "no" || base === "nb" || base === "nn") found = "nb";
    else if (base === "en") found = "en";
    else if (known.indexOf(base) >= 0) found = base;
    if (found) { pick = found; break; }
  }
  // A local try may ask for a language (?lang=ja); the site never does.
  var asked = /[?&]lang=([A-Za-z-]+)/.exec(location.search);
  if (asked && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && (asked[1] === "en" || known.indexOf(asked[1]) >= 0)) pick = asked[1];
  window.WANTD_LANG = pick;
  if (pick !== "en") document.write('<script src="/feed/words/' + pick + '.js?v=2"><\/script>');
})();
</script>
<script src="/feed/ck.js?v=1"></script>
<style>
  /* The app's own tokens (ContentView.swift wantdAdaptive, Color.kt). */
  :root {
    --ivory: #FAFAFB;
    --surface: #FFFFFF;
    --ivory-deep: #F3F3F4;
    --mist: #F5F5F6;
    --ink: #0E0E0F;
    --ink-soft: #666669;
    --olive: #9D9DA1;
    --clay: #8B8B8F;
    --cobalt: #0228B2;
    --tile: #FFFFFF;
    --shadow-card: 0 6px 16px rgba(0,0,0,0.06);
    --shadow-tile: 0 2px 5px rgba(0,0,0,0.05);
    --shadow-pill: 0 4px 12px rgba(0,0,0,0.08);
    --scrim: rgba(14,14,15,0.16);
    --shadow-cartel: 0 12px 44px rgba(14,14,15,0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ivory: #000001;
      --surface: #141416;
      --ivory-deep: #0E0E10;
      --mist: #0B0B0D;
      --ink: #F6F6F7;
      --ink-soft: #9D9DA1;
      --olive: #4D4D52;
      --clay: #5C5C61;
      --shadow-card: 0 6px 16px rgba(0,0,0,0.4);
      --shadow-tile: 0 2px 5px rgba(0,0,0,0.3);
      --shadow-pill: 0 4px 12px rgba(0,0,0,0.5);
      --scrim: rgba(0,0,1,0.5);
      --shadow-cartel: 0 12px 44px rgba(0,0,0,0.6);
    }
  }

  /* On a Mac or an iPhone the app's own faces (New York, SF); elsewhere
     Newsreader and Libre Franklin, the same voices. */
  @font-face { font-family: "Newsreader"; src: url("/fonts/newsreader.woff2") format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }
  @font-face { font-family: "Newsreader"; src: url("/fonts/newsreader-italic.woff2") format("woff2"); font-weight: 200 800; font-style: italic; font-display: swap; }
  @font-face { font-family: "Libre Franklin"; src: url("/fonts/libre-franklin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    --serif: ui-serif, "Newsreader", "New York", Georgia, serif;
    --sans: -apple-system, system-ui, "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--ivory);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.3;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  img { display: block; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 4px; }
  /* A card never wears a ring: tapped or clicked, it opens, as in the app
     (Agathe, 10 November 2026). */
  .card .photo:focus, .card .photo:focus-visible, .ftile:focus, .ftile:focus-visible, .fthumb:focus, .fthumb:focus-visible { outline: none; }
  /* The open card itself takes the focus (so Escape and the keys reach it)
     and must never be framed for it, nor a sheet or the entrance. */
  #piece .cartel:focus, #piece .cartel:focus-visible, #wSheet .panel:focus, #wSheet .panel:focus-visible, #wEnter:focus, #wEnter:focus-visible, #wEnter .epage:focus { outline: none; }
  [hidden] { display: none !important; }
  .serif { font-family: var(--serif); }
  .num { font-family: var(--serif); font-weight: 300; font-style: italic; letter-spacing: -0.2px; font-variant-numeric: lining-nums; }

  /* ---------------------------------------------------------------- */
  /* The top bar: the word at the left, the pill in the middle.       */
  /* ---------------------------------------------------------------- */
  .bar {
    position: sticky; top: 0; z-index: 20;
    height: 52px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 22px;
    background: var(--ivory);
  }
  .bar .word { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; color: var(--ink); }
  .pill {
    position: relative;
    display: flex; align-items: center;
    padding: 0 4px;
    background: var(--surface);
    border-radius: 999px;
    box-shadow: 0 0 0 0.5px rgba(102,102,105,0.10), var(--shadow-pill);
  }
  /* The glass under the current word: two round caps and a stretched
     middle, moved by transform alone, so the glide stays on the compositor
     while the new screen is being built (seatGlass, glide). The leading
     edge leaves first, the trailing one follows: the drop stretches, then
     settles. */
  .pill .glass { position: absolute; top: 4px; bottom: 4px; left: 0; right: 0; pointer-events: none; }
  .pill .glass i { position: absolute; top: 0; left: 0; height: 100%; background: var(--ivory-deep); }
  .pill .glass .l, .pill .glass .r { border-radius: 999px; }
  .pill .glass .m { width: 1px; transform-origin: 0 50%; }
  .pill button {
    position: relative;
    padding: 4px 0;
  }
  .pill button span {
    display: block;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 15px; font-weight: 500;
    color: var(--ink); opacity: 0.62;
    text-align: center;
    transition: opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* The bold word's width, reserved: the neighbours never shift. */
  .pill button span::after { content: attr(data-label); display: block; height: 0; overflow: hidden; visibility: hidden; font-weight: 600; }
  @media (hover: hover) { .pill button:hover span { opacity: 0.85; } }
  .pill button[aria-current="page"] span { font-weight: 600; opacity: 1; }
  .pill button[aria-disabled="true"] { cursor: default; }

  /* ---------------------------------------------------------------- */
  /* The page: 16 of padding, like the app's section.                  */
  /* ---------------------------------------------------------------- */
  main { padding: 8px 16px 40px; }
  .head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-top: 8px;
    min-height: 36px;
  }
  .head .label { font-size: 13px; font-weight: 300; color: var(--ink-soft); padding-left: 4px; }
  .icon-btn {
    width: 36px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink); align-self: center;
  }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  @media (pointer: coarse) { .icon-btn { min-width: 44px; min-height: 44px; } }

  /* Search: one quiet capsule. */
  .search { margin: 10px 0 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .search .field {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 11px 16px; border-radius: 999px;
    background: var(--surface);
    box-shadow: 0 0 0 0.5px rgba(102,102,105,0.12), var(--shadow-tile);
  }
  .search .field svg { width: 13px; height: 13px; stroke: var(--ink-soft); fill: none; stroke-width: 1.2; stroke-linecap: round; flex: none; }
  .search input {
    flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 300; color: var(--ink);
    caret-color: var(--cobalt);
  }
  .search input::placeholder { color: var(--ink-soft); opacity: 0.6; }
  .search input:focus { outline: none; }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
  .search .clear { width: 20px; height: 20px; border-radius: 50%; background: var(--ink-soft); opacity: 0.5; color: var(--surface); display: inline-flex; align-items: center; justify-content: center; }
  .search .clear svg { width: 8px; height: 8px; stroke: currentColor; stroke-width: 1.8; fill: none; }

  /* The row of shops: white tiles, 144 by 84, sliding 40 a second. */
  .stores { margin: 10px -16px 0; height: 84px; overflow: hidden; position: relative; }
  .stores .track { display: flex; gap: 10px; width: max-content; will-change: transform; animation: slide var(--dur, 60s) linear infinite; }
  .stores:hover .track, .stores:focus-within .track { animation-play-state: paused; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(calc(-1 * var(--set))); } }
  .tile {
    flex: none; width: 144px; height: 84px; border-radius: 18px;
    background: var(--tile);
    box-shadow: 0 0 0 0.5px rgba(102,102,105,0.10), var(--shadow-tile);
    display: flex; align-items: center; justify-content: center;
    padding: 18px 16px;
  }
  .tile img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  @media (prefers-reduced-motion: reduce) {
    .stores { overflow-x: auto; scrollbar-width: none; }
    .stores::-webkit-scrollbar { display: none; }
    .stores .track { animation: none; padding: 0 16px; }
  }

  /* A shop's page: the chevron, the name, the count, the link. */
  .store-head { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 8px; position: relative; }
  .store-head .back { position: absolute; left: 0; top: 8px; width: 30px; height: 36px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
  .store-head .back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .store-head h1 { font-family: var(--serif); font-size: 26px; font-weight: 300; font-style: italic; color: var(--ink); margin-top: 20px; text-align: center; padding: 0 36px; }
  .store-head .count { font-size: 12px; font-weight: 300; color: var(--ink-soft); }
  .store-head .open { font-size: 13px; font-weight: 400; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; margin-top: 4px; }

  /* Quiet states, in the app's words. */
  .state { text-align: center; padding-top: 48px; color: var(--ink-soft); font-size: 13px; font-weight: 300; }
  .state.serif { font-family: var(--serif); font-size: 15px; font-style: italic; color: var(--ink); }
  .state.tall { padding-top: 120px; }
  .state .title { font-family: var(--serif); font-size: 18px; font-weight: 300; color: var(--ink); margin-bottom: 12px; }
  .state .findstores { display: block; margin: 14px auto 0; font-family: var(--sans); font-size: 13px; font-style: normal; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .state .spin { width: 18px; height: 18px; margin: 0 auto 14px; border-radius: 50%; border: 1.5px solid var(--ink-soft); border-top-color: transparent; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .state .spin { animation: none; border-top-color: var(--ink-soft); opacity: 0.5; } }

  /* ---------------------------------------------------------------- */
  /* The wall: five balanced columns, twelve apart.                    */
  /* ---------------------------------------------------------------- */
  .wall { display: flex; align-items: flex-start; gap: 12px; margin: 18px -6px 0; }
  .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  /* The feed's walls breathe less (SED-982, Agathe, 11 November: "agrandir les
     images et réduire l'écart"): eight pixels between photos and from the
     phone's edge, as Pinterest's phone grid; the wide wall keeps sixteen at
     the edge, where the header sits, and ten between. Her own list and a
     friend's keep their air until she says so. */
  #riverWall, #storeWall { gap: 10px; margin-left: 0; margin-right: 0; }
  #riverWall .col, #storeWall .col { gap: 10px; }
  @media (max-width: 767px) {
    #riverWall, #storeWall { gap: 8px; margin-left: -8px; margin-right: -8px; }
    #riverWall .col, #storeWall .col { gap: 8px; }
  }
  .card {
    background: var(--surface);
    border-radius: 20px;
    box-shadow: 0 0 0 0.5px rgba(102,102,105,0.08), var(--shadow-card);
    overflow: hidden;
    animation: settle 0.3s ease-out both;
  }
  @keyframes settle { from { opacity: 0.4; transform: scale(0.95); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  .card .photo {
    position: relative; display: block; width: 100%;
    border-radius: 16px; overflow: hidden;
    background: var(--ivory-deep);
    text-align: left;
  }
  .card .photo.waiting { aspect-ratio: var(--ar, 1); }
  .card .photo img { width: 100%; height: auto; }
  .card .photo.waiting img { position: absolute; inset: 0; height: 100%; object-fit: contain; opacity: 0; }
  .rewant {
    position: absolute; top: 8px; right: 8px;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--ivory) 92%, transparent);
    box-shadow: 0 0 0 0.5px rgba(102,102,105,0.12);
    color: var(--ink);
    font-size: 14px;
  }
  .rewant svg { width: 15px; height: 10px; stroke: currentColor; fill: none; stroke-width: 0.78; stroke-linecap: round; stroke-linejoin: round; }
  .card .text { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .card .shop { font-size: 8.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .name {
    font-family: var(--serif); font-size: 13px; font-weight: 400; color: var(--ink); line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .price { font-size: 13px; color: var(--ink); margin-top: 1px; }
  .card .owner { font-size: 10px; color: var(--ink-soft); opacity: 0.7; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .owner.linked { cursor: pointer; }
  .sentinel { height: 1px; }

  /* ---------------------------------------------------------------- */
  /* The piece: a cartel on the Mac, a sheet on the phone.             */
  /* ---------------------------------------------------------------- */
  /* The page held still under a card or a sheet, without a jump: the body
     is pinned where she was, and set back there when the card goes. */
  body.held { position: fixed; left: 0; right: 0; overflow: hidden; }
  #piece { position: fixed; inset: 0; z-index: 40; display: none; }
  #piece.on { display: block; }
  #piece .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 0.3s ease; }
  #piece.in .scrim { opacity: 1; }
  #piece .cartel {
    position: absolute; left: 50%; top: 44px; bottom: 44px;
    width: min(720px, calc(100vw - 48px));
    transform: translate(-50%, 30px);
    background: var(--ivory);
    border-radius: 22px;
    box-shadow: var(--shadow-cartel);
    overflow: auto; overscroll-behavior: contain;
    opacity: 0;
    transition: opacity 0.52s ease-out, transform 0.52s ease-out;
  }
  #piece.in .cartel { opacity: 1; transform: translate(-50%, 0); }
  #piece.out .scrim { transition-duration: 0.34s; }
  #piece.out .cartel { transition: opacity 0.34s ease-in, transform 0.34s ease-in; }
  @media (prefers-reduced-motion: reduce) { #piece .cartel { transition: opacity 0.3s ease; transform: translate(-50%, 0); } }
  .cartel .hero { height: 540px; display: flex; align-items: center; justify-content: center; padding: 32px 32px 0; }
  .cartel .hero img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  .cartel .hero .blank { width: 60%; height: 100%; background: var(--ivory-deep); border-radius: 4px; }
  .cartel .body { padding: 28px 32px 40px; }
  .cartel .maker { font-size: 14px; font-weight: 700; text-transform: uppercase; color: var(--ink); }
  .cartel .note { font-family: var(--serif); font-size: 13px; font-weight: 300; font-style: italic; color: var(--ink-soft); margin-top: 8px; white-space: pre-wrap; }
  .cartel .baseprice { font-size: 12px; font-weight: 300; color: var(--ink-soft); width: 100%; }
  .cartel .title { font-family: var(--serif); font-size: 24px; font-weight: 300; font-style: italic; color: var(--ink); line-height: 1.3; margin-top: 4px; padding-bottom: 2px; }
  .cartel .line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .cartel .line .price { font-size: 16px; color: var(--ink); }
  .cartel .line .host, .cartel .line .date { font-size: 12px; color: var(--ink-soft); }
  .cartel .from { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .cartel .acts { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .cartel .shop {
    display: block; width: 100%; text-align: center;
    padding: 15px 0; background: var(--ink); color: var(--ivory);
    font-size: 13px; font-weight: 400; text-decoration: none;
  }
  .cartel .shop:active { opacity: 0.85; }
  /* The app has no close button: the scrim and Escape close the cartel. One
     stays for the keyboard and the screen reader, out of sight until focused. */
  .cartel .close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); opacity: 0; pointer-events: none; }
  .cartel .close svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.4; fill: none; stroke-linecap: round; }
  .cartel .close:focus-visible { opacity: 1; pointer-events: auto; }
  .cartel .grab { display: none; }

  /* ---------------------------------------------------------------- */
  /* The phone: two columns, the pill at the foot, a sheet.            */
  /* ---------------------------------------------------------------- */
  @media (max-width: 767px) {
    .bar { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; padding: 0 0 calc(24px + env(safe-area-inset-bottom)); background: none; grid-template-columns: 1fr; justify-items: center; pointer-events: none; }
    .bar .word, .bar .spacer { display: none; }
    .pill { pointer-events: auto; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); background: color-mix(in srgb, var(--surface) 80%, transparent); }
    .pill button span { padding: 10px 20px; font-size: 16px; }
    main { padding: calc(8px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); }
    .stores .track { animation-duration: var(--dur, 60s); }
    #piece .cartel {
      top: 60px; bottom: 0; width: 100%; left: 0; transform: translate(0, 40px);
      border-radius: 22px 22px 0 0; box-shadow: var(--shadow-cartel);
    }
    #piece.in .cartel { transform: translate(0, 0); }
    .cartel .grab { display: block; width: 38px; height: 4px; border-radius: 2px; background: var(--ink-soft); opacity: 0.3; margin: 10px auto 0; }
    .cartel .hero { height: 320px; padding: 20px 16px 0; }
    .cartel .body { padding: 24px 16px calc(40px + env(safe-area-inset-bottom)); }

  }

  /* ---------------------------------------------------------------- */
  /* Wishlist: her header, her list tabs, Sort / Filter, the plus.      */
  /* ---------------------------------------------------------------- */
  #wDoor, #fDoor { padding-top: 120px; max-width: 320px; margin: 0 auto; }
  /* CloudKit's own buttons stay in the page for their click, out of sight:
     the member sees the three ways in, as everyone knows them. */
  .ckhidden { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  .door .doortitle { font-size: 23px; font-weight: 300; letter-spacing: -0.4px; line-height: 29px; color: var(--ink); padding: 0 2px; }
  .door .ways { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .way { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; width: 100%; border-radius: 999px; font-size: 16px; font-weight: 500; white-space: nowrap; transition: opacity 0.12s ease; }
  .way:active { opacity: 0.72; }
  .way.apple { background: #000000; color: #FFFFFF; }
  .way.apple svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  /* Google's own values for its light button: the text and the one-pixel outline. */
  .way.plain { background: #FFFFFF; color: #1F1F1F; border: 1px solid #747775; }
  .way.plain:disabled { opacity: 0.5; }
  .way.plain svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

<script>
// ---------------------------------------------------------------------------
// The words, as the app says them (Localizable.xcstrings), by the browser's
// language. Never a long dash.
// ---------------------------------------------------------------------------
const LANG = window.WANTD_LANG || "en";
const FR = LANG === "fr";
document.documentElement.lang = LANG;
document.documentElement.dir = (LANG === "ar" || LANG === "he") ? "rtl" : "ltr";
// The words of the page in her language (feed/words/<lang>.js, written by
// tools/words.py from the app's catalog), laid over the English of the
// dictionaries below: a plain word replaces its English; a sentence with
// {0} {1} fills in; a counted sentence is a table of plural forms picked by
// the language's own rules, {n} being the count.
const WORDS = window.WANTD_WORDS || {};
const PLURAL = (() => { try { return new Intl.PluralRules(LANG); } catch (e) { return new Intl.PluralRules("en"); } })();
const fill = (s, args) => String(s).replace(/\{(\d+|n)\}/g, (m, k) => (k === "n" ? args.n : args[Number(k)]));
function words(dict, en) {
  const over = WORDS[dict] || {};
  const out = {};
  for (const [k, v] of Object.entries(en)) {
    const o = over[k];
    if (o == null) { out[k] = v; continue; }
    if (typeof v !== "function") { out[k] = typeof o === "string" ? o : v; continue; }
    if (typeof o === "string") { out[k] = (...a) => fill(o, a); continue; }
    if (o.a && o.b) { out[k] = (who, ...rest) => (who ? fill(o.a, [who, ...rest]) : fill(o.b, rest)); continue; }
    // A counted sentence: the count first, shown in the viewer's digits; the
    // community line adds its "+" after the count.
    out[k] = (n, more) => fill(o[PLURAL.select(n)] || o.other || "", { n: Number(n).toLocaleString(LOCALE) + (more === true ? "+" : "") });
  }
  return out;
}
const T = words("T", {
  feed: "Feed", friends: "Friends", wishlist: "Wishlist",
  stores: "Popular Stores", search: "Search", searchPrompt: "Search the feed",
  searching: "Looking through every list...", searchEmpty: "Nothing in the feed for that, yet.",
  loading: "Loading the feed…", onItsWay: "Your feed is on its way.",
  storeEmpty: "Nothing from this shop yet.", wanting: "what people are wanting",
  open: (h) => `Open ${h}`, shop: "Shop", from: (n) => `From ${n}`,
  community: (n, more) => `${n}${more ? "+" : ""} ${n === 1 ? "want" : "wants"} from the community`,
  emptyTitle: "Nothing here yet", emptyBody: "As people add wants, they'll show up here.",
  back: "Back", close: "Close", clear: "Clear", cancel: "Cancel", toCheck: "Price to check",
  findStores: "Find it in the stores", perL: (p) => `${p} / 1 l`, perKg: (p) => `${p} / 1 kg`, reserved: "Reserved",
});
document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[el.dataset.t]; });
document.getElementById("q").placeholder = T.searchPrompt;
document.getElementById("searchToggle").setAttribute("aria-label", T.search);
document.getElementById("storeBack").setAttribute("aria-label", T.back);
document.getElementById("pieceClose").setAttribute("aria-label", T.close);
document.getElementById("clearQ").setAttribute("aria-label", T.clear);

// ---------------------------------------------------------------------------
// The worker: the same reads as the app. On a local try the page goes
// through the dev server's proxy; on the site it reads the worker itself.
// ---------------------------------------------------------------------------
const LOCAL = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
const API = LOCAL ? "/__api" : "https://wantd-reserve.wantd-reserve.workers.dev";
const WORKER = "https://wantd-reserve.wantd-reserve.workers.dev";
const CHANNEL = "web";
const PAGE = 120;        // FeedView.wallPage
const REGULAR = matchMedia("(min-width: 768px)");
const columnsNow = () => (REGULAR.matches ? 5 : 2);

async function getJSON(path, tries = 3) {
  for (let i = 0; ; i++) {
    const r = await fetch(API + path, { headers: { "Accept": "application/json" } });
    if (r.ok) return r.json();
    // A cold worker answers 503 once; the app asks again, so does the page.
    if (r.status === 503 && i + 1 < tries) { await new Promise((d) => setTimeout(d, 1500 * (i + 1))); continue; }
    throw new Error(path + " " + r.status);
  }
}

// CloudKit JS (SED-942): the member's own iCloud account, the same
// identity as the iPhone's. Configured here, quietly; the sign-in and the
// Wishlist tab come in the second step. Nothing of this is read before
// then, and a browser without iCloud reaches the public feed all the same.
window.wantdAuth = { ready: false, identity: null, error: null };
(function () {
  const cfg = window.WANTD_CK;
  if (!cfg || !cfg.token || LOCAL) return;
  const s = document.createElement("script");
  s.src = "https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"; s.async = true;
  s.onload = async () => {
    try {
      CloudKit.configure({ containers: [{ containerIdentifier: cfg.container, apiTokenAuth: { apiToken: cfg.token, persist: true, signInButton: { id: "ckSignIn", theme: "black" }, signOutButton: { id: "ckSignOut", theme: "black" } }, environment: cfg.env }] });
      const identity = await CloudKit.getDefaultContainer().setUpAuth();
      window.wantdAuth = { ready: true, identity: identity || null, error: null };
    } catch (e) { window.wantdAuth = { ready: true, identity: null, error: String(e && (e.reason || e.message || e)) }; }
  };
  document.head.appendChild(s);
})();

// The tracked link reader, loaded beside this page (SED-855).
(function () {
  const s = document.createElement("script");
  s.src = WORKER + "/affiliate.js"; s.async = true;
  document.head.appendChild(s);
})();
function shopURL(u, meta) {
  try { return (u && window.WantdAffiliate) ? window.WantdAffiliate.shopURL(u, CHANNEL, meta || {}) : u; } catch (e) { return u; }
}

// ---------------------------------------------------------------------------
// One product, one key (url_key.js, line for line): the wanters are counted

  else if (st.store) { show("store", animate); openStore(st.store, st.name); }
  else { show("river", animate); }
  prettify();
}
// The word tapped again scrolls to the top; judged on the screen asked for
// (`want`), not the one drawn, which follows a frame later.
const toTop = () => window.scrollTo({ top: 0, behavior: "smooth" });
document.getElementById("tabFeed").addEventListener("click", () => { if (want.tab || want.store) go({}); else toTop(); });
document.getElementById("tabWishes").addEventListener("click", () => { if (want.tab !== "wishes") go({ tab: "wishes" }); else toTop(); });
document.getElementById("tabFriends").addEventListener("click", () => { if (want.tab !== "friends" || want.u) go({ tab: "friends" }); else toTop(); });
window.addEventListener("popstate", (e) => {
  if (closingByBack) { closingByBack = false; return; }
  frameToken++;
  const u = new URL(location.href);
  const st = e.state || { store: u.searchParams.get("store") || "", name: "", tab: u.searchParams.get("tab") || "", u: u.searchParams.get("u") || "" };
  const p = u.searchParams.get("p");
  if (pieceOpen && !p) { closePiece(true); if (st.store !== store.host) render(st, true); return; }
  if (p) { render(st); const it = findPiece(p); if (it) openPiece(it, true); }
  else render(st, true);
});
function findPiece(id) {
  // Her own copy first: the card edits the very object her list holds.
  return (window.Wishes && window.Wishes.findMine ? window.Wishes.findMine(id) : null) || river.items.find((i) => i.id === id) || store.items.find((i) => i.id === id) || search.results.find((i) => i.id === id) || null;
}
function openDeepLink() {
  const p = new URL(location.href).searchParams.get("p");
  if (!p || pieceOpen) return;
  // The page itself stands under the card: the address without ?p= is the
  // one Back returns to, so closing the card never leaves the site.
  const base = new URL(location.href); base.searchParams.delete("p");
  history.replaceState(stateNow({}), "", base);
  const it = findPiece(p);
  if (it) { openPiece(it); return; }
  // Not among the pieces here: read by its id (any piece of the public base).
  if (window.Wishes && window.Wishes.readPiece) window.Wishes.readPiece(p).then((found) => { if (found && !pieceOpen) openPiece(found); }).catch(() => {});
}
(function start() {
  const u = new URL(location.href);
  const st = { store: u.searchParams.get("store") || "", name: "", tab: u.searchParams.get("tab") || "", u: u.searchParams.get("u") || "" };
  history.replaceState(st, "", u);
  render(st);
  loadRiver();
})();

// More as she nears the foot of the wall.
const io = new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (!en.isIntersecting) continue;
    if (en.target.id === "riverMore" && !search.open) { if (!showMoreOfRiver()) riverTail(); }
    if (en.target.id === "storeMore" && store.host) storeMore(store.seq);
  }
}, { rootMargin: "1200px 0px" });
io.observe(document.getElementById("riverMore"));
io.observe(document.getElementById("storeMore"));

// Five columns or two: the wall is dealt again when the width crosses over.
REGULAR.addEventListener("change", () => {
  if (search.open && search.q) { riverWall.reset(); riverWall.add(search.results, { counts: countOf, quiet: true }); }
  else { riverWall.reset(); const n = river.shown; river.shown = 0; riverWall.add(river.items.slice(0, n), { counts: countOf, quiet: true }); river.shown = n; }
  if (store.host) { storeWall.reset(); storeWall.add(store.items, {}); }
});
</script>
