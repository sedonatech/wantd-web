<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wantd</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAFAFB">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://api.apple-cloudkit.com" crossorigin>
<script src="/feed/ck.js?v=1"></script>
<style>
  :root { --ivory: #FAFAFB; --ink: #0E0E0F; --ink-soft: #666669; --cobalt: #0228B2; }
  @font-face { font-family: "Libre Franklin"; src: url("/fonts/libre-franklin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  html, body { margin: 0; background: var(--ivory); color: var(--ink); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Libre Franklin", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100svh; display: flex; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px 28px calc(28px + env(safe-area-inset-bottom)); max-width: 420px; width: 100%; box-sizing: border-box; margin: 0 auto; }
  .mark { font-weight: 600; font-size: 22px; letter-spacing: -0.5px; color: var(--cobalt); margin-bottom: 44px; }
  h1 { font-weight: 300; font-size: 29px; line-height: 1.2; letter-spacing: -0.5px; margin: 0 0 12px; }
  p { font-size: 15px; font-weight: 300; line-height: 1.45; color: var(--ink-soft); margin: 0 0 30px; }
  .cta { display: block; width: 100%; box-sizing: border-box; border: 0; border-radius: 999px; background: var(--cobalt); color: #F6F4EE; font: 500 15px/1 inherit; font-family: inherit; padding: 17px 20px; text-align: center; text-decoration: none; cursor: pointer; }
  .cta[disabled] { opacity: .5; cursor: default; }
  .apple { display: flex; align-items: center; justify-content: center; gap: 10px; background: #000; color: #fff; font-weight: 500; font-size: 16px; height: 52px; padding: 0 20px; }
  .apple svg { height: 20px; width: auto; display: block; }
  .apple:active { opacity: .72; }
  .quiet { display: inline-block; margin-top: 22px; font-size: 13px; font-weight: 300; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; font-family: inherit; }
  .note { font-size: 13px; color: var(--ink-soft); margin: 18px 0 0; }
  .ckhidden { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="mark">Wantd.</div>

  <section id="sAsk">
    <h1 id="tAsk">Continue with Apple.</h1>
    <p id="pAsk">Sign in with your Apple account: your wishlist comes with it.</p>
    <button class="cta apple" id="bApple" type="button"><svg viewBox="0 0 1261 1551" aria-hidden="true"><path fill="#fff" d="M914 375Q936 375 989 382Q1042 389 1105.5 421.5Q1169 454 1221 529Q1218 532 1192 550.5Q1166 569 1134 604.5Q1102 640 1078 694.5Q1054 749 1054 824Q1054 910 1084.5 970Q1115 1030 1155.5 1066.5Q1196 1103 1227.5 1120Q1259 1137 1261 1138Q1260 1142 1235.5 1209Q1211 1276 1155 1358Q1106 1429 1049.5 1489Q993 1549 914 1549Q861 1549 827 1533.5Q793 1518 757 1502.5Q721 1487 660 1487Q601 1487 561.5 1503Q522 1519 486.5 1535Q451 1551 403 1551Q330 1551 275 1493Q220 1435 162 1354Q95 1258 47.5 1119.5Q0 981 0 840Q0 689 57 586.5Q114 484 203.5 431.5Q293 379 389 379Q440 379 485 395.5Q530 412 569.5 429Q609 446 641 446Q672 446 713 428Q754 410 805 392.5Q856 375 914 375ZM859 248Q820 295 761 326.5Q702 358 649 358Q638 358 628 356Q627 353 626 345Q625 337 625 328Q625 268 651 211.5Q677 155 710 118Q752 68 816 35Q880 2 938 0Q941 13 941 31Q941 91 918 147.5Q895 204 859 248Z"/></svg><span id="lApple">Continue with Apple</span></button>
  </section>

  <section id="sWait" hidden>
    <h1 id="tWait">One moment.</h1>
  </section>

  <section id="sDone" hidden>
    <h1 id="tDone">Welcome back.</h1>
    <p id="pDone"></p>
    <a class="cta" id="bBack" href="#">Back to Wantd</a>
    <button class="quiet" id="bOut" type="button">Not you? Sign out</button>
    <p class="note" id="pDebug" hidden></p>
  </section>

  <section id="sFail" hidden>
    <h1 id="tFail">That didn't work.</h1>
    <p id="pFail"></p>
    <button class="cta" id="bAgain" type="button">Try again</button>
  </section>

  <div id="ckSignIn" class="ckhidden"></div>
  <div id="ckSignOut" class="ckhidden"></div>
</main>
<script>
// Continue with Apple, for the Android app (SED-947 / SED-948): CloudKit JS
// signs her in with her Apple ID (the same member as on her iPhone), the
// bridge checks the session and answers a one-time hand-off code, and
// "Back to Wantd" carries that code into the app. The Apple session itself
// never leaves this page.
//
// This page lives at /feed/connect.html on purpose: CloudKit JS keeps its
// session in a cookie whose path is the page's folder, and reads back the
// LAST cookie of that name. A second folder under /feed/ would leave two
// cookies and "Could not read or write ckSession". Same folder, one cookie.
(function () {
  // The one stray cookie an earlier /feed/connect/ address left behind.
  document.cookie = "iCloud.com.sedonatech.WANTD=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/feed/connect";
  var BRIDGE = "https://wantd-android.wantd-reserve.workers.dev";
  var PACKAGE = "com.sedonatech.wantd";
  var DONE = "https://wantd.sedonatech.uk/feed/connect/done/";
  var T = {
    en: { ask: "Continue with Apple.", askLine: "Sign in with your Apple account: your wishlist comes with it.", apple: "Continue with Apple",
          wait: "One moment.", back: "Back to Wantd", out: "Not you? Sign out", welcome: "Welcome back, {name}.", welcomeNew: "Welcome.",
          doneLine: "Your wishlist is waiting in the app.", doneLineNew: "The app will ask your name.",
          fail: "That didn't work.", again: "Try again", refused: "Apple didn't recognise this sign-in. Try again.", offline: "Couldn't reach Wantd. Check your connection and try again." },
    fr: { ask: "Continuer avec Apple.", askLine: "Connectez-vous avec votre compte Apple : votre liste d’envies vient avec.", apple: "Continuer avec Apple",
          wait: "Un instant.", back: "Retour dans Wantd", out: "Ce n’est pas vous ? Se déconnecter", welcome: "Bon retour, {name}.", welcomeNew: "Bienvenue.",
          doneLine: "Votre liste d’envies vous attend dans l’app.", doneLineNew: "L’app vous demandera votre prénom.",
          fail: "Ça n’a pas marché.", again: "Réessayer", refused: "Apple n’a pas reconnu cette connexion. Réessayez.", offline: "Wantd est injoignable. Vérifiez votre connexion et réessayez." }
  };
  var lang = (navigator.language || "en").slice(0, 2) === "fr" ? "fr" : "en";
  var W = T[lang];
  document.documentElement.lang = lang;
  var $ = function (id) { return document.getElementById(id); };
  $("tAsk").textContent = W.ask; $("pAsk").textContent = W.askLine; $("lApple").textContent = W.apple;
  $("tWait").textContent = W.wait; $("bBack").textContent = W.back; $("bOut").textContent = W.out;
  $("tFail").textContent = W.fail; $("bAgain").textContent = W.again;
  var params = new URLSearchParams(location.search);
  var debug = params.has("debug");
  // "Back to Wantd" only makes sense inside the app's tab (?app=1); on a computer the page just says who she is.
  var inApp = params.has("app");

  function show(id) { ["sAsk", "sWait", "sDone", "sFail"].forEach(function (s) { $(s).hidden = s !== id; }); }
  function fail(msg, why) { if (why) console.warn("wantd connect:", String(why && (why.message || why.reason || why))); $("pFail").textContent = msg; show("sFail"); }
  function cookie(name) {
    var parts = document.cookie.split(";");
    for (var i = 0; i < parts.length; i++) { var c = parts[i].trim(); if (c.indexOf(name + "=") === 0) return c.slice(name.length + 1); }
    return null;
  }
  function clickHidden(id) { var b = $(id).querySelector(".apple-auth-button, button, [role=button], div"); if (b) b.click(); }

  var container = null;
  function handOff() {
    var cfg = window.WANTD_CK;
    var token = cookie(cfg.container);
    if (!token) return fail(W.refused);
    show("sWait");
    fetch(BRIDGE + "/v1/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ apple: token, handoff: true }) })
      .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (res) {
        if (res.status !== 200 || !res.body || !res.body.handoff) return fail(res.status === 401 ? W.refused : W.offline);
        var p = res.body.profile;
        var name = p && p.displayName ? p.displayName.split(" ")[0] : "";
        $("tDone").textContent = p ? W.welcome.replace("{name}", name) : W.welcomeNew;
        $("pDone").textContent = p ? W.doneLine : W.doneLineNew;
        var code = res.body.handoff;
        $("bBack").href = "intent://wantd.sedonatech.uk/feed/connect/done/?h=" + encodeURIComponent(code) +
          "#Intent;scheme=https;package=" + PACKAGE + ";S.browser_fallback_url=" + encodeURIComponent(DONE) + ";end";
        $("bBack").hidden = !inApp;
        if (debug) { $("pDebug").hidden = false; $("pDebug").textContent = "account " + res.body.ownerID + (p ? " · " + p.handle : " · no profile"); }
        show("sDone");
      })
      .catch(function (e) { fail(W.offline, e); });
  }

  function setUp() {
    var cfg = window.WANTD_CK;
    CloudKit.configure({ containers: [{ containerIdentifier: cfg.container,
      apiTokenAuth: { apiToken: cfg.token, persist: true, signInButton: { id: "ckSignIn", theme: "black" }, signOutButton: { id: "ckSignOut", theme: "black" } },
      environment: cfg.env }] });
    container = CloudKit.getDefaultContainer();
    container.setUpAuth().then(function (identity) {
      if (identity) handOff();
      container.whenUserSignsIn().then(function () { handOff(); }).catch(function (e) { fail(W.refused, e); });
      container.whenUserSignsOut().then(function () { show("sAsk"); setTimeout(function () { location.reload(); }, 300); });
    }).catch(function (e) { fail(W.offline, e); });
  }

  $("bApple").addEventListener("click", function () { clickHidden("ckSignIn"); });
  $("bOut").addEventListener("click", function () { clickHidden("ckSignOut"); });
  $("bAgain").addEventListener("click", function () { location.reload(); });

  var s = document.createElement("script");
  s.src = "https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"; s.async = true;
  s.onload = setUp; s.onerror = function () { fail(W.offline, "cloudkit.js did not load"); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
