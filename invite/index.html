<style>
  :root {
    --paper: #FAFAFB;
    --tile: #FFFFFF;
    --ink: #0E0E0F;
    --ink-soft: #5E5E62;
    --cobalt: #0228B2;
    --hair: rgba(14,14,15,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    height: 100svh;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    overflow: hidden;
  }
  ::selection { background: var(--cobalt); color: var(--paper); }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 4px; border-radius: 999px; }

  /* The wall: what people want, before any word. */
  .wall {
    position: relative;
    min-height: 0;
    overflow: hidden;
    padding: max(14px, env(safe-area-inset-top)) 14px 0;
    -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent);
            mask-image: linear-gradient(to bottom, #000 62%, transparent);
  }
  .cols { display: flex; gap: 10px; align-items: flex-start; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .col.c2 { margin-top: 56px; }
  .tile {
    background: var(--tile);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(14,14,15,0.05);
  }
  .tile img { display: block; width: 100%; height: auto; }

  .door {
    display: flex;
    flex-direction: column;
    padding: 6px 30px max(34px, env(safe-area-inset-bottom));
    max-width: 460px;
  }
  .mark { display: flex; align-items: center; gap: 12px; }
  .mark img { width: 44px; height: 44px; border-radius: 11px; }
  .word {
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--cobalt);
    line-height: 1;
  }
  .line {
    margin-top: 14px;
    font-size: 17px;
    line-height: 1.4;
    color: var(--ink-soft);
  }
  .acts { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
  .store {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 52px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background 0.25s;
  }
  .store:hover { background: #26262A; }
  .store:active { transform: scale(0.98); }
  .store svg { width: 18px; height: 18px; fill: currentColor; }
  .store[hidden] { display: none; }
  .browser {
    align-self: center;
    margin-top: 14px;
    padding: 6px 2px;
    font-size: 15px;
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: rgba(14,14,15,0.35);
    text-underline-offset: 4px;
  }
  .browser:hover { text-decoration-color: var(--cobalt); }

  /* A wide screen: the words on the left, the wall filling the right. */
  @media (min-width: 900px) {
    body { grid-template-rows: none; grid-template-columns: minmax(400px, 0.9fr) 1.1fr; }
    .wall { order: 2; height: 100svh; padding: 18px 18px 0 0;
      -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent); }
    .cols, .col { gap: 14px; }
    .col.c2 { margin-top: 120px; }
    .tile { border-radius: 18px; }
    .door { order: 1; justify-content: center; padding: 0 56px 0 clamp(40px, 7vw, 110px); max-width: 560px; }
    .word { font-size: 64px; }
    .mark img { width: 56px; height: 56px; border-radius: 13px; }
    .line { font-size: 19px; }
    .acts { flex-direction: row; flex-wrap: wrap; }
    .store { flex: 1 1 180px; }
    .browser { align-self: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) { .store { transition: none; } }
</style>
</head>
