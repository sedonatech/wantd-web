<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wantd</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --paper: rgb(250,250,251);
    --ink: rgb(14,14,15);
    --ink-soft: rgb(102,102,107);
    --hair: rgba(14,14,15,0.16);
    --accent: rgb(2,40,178);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: rgb(0,0,1);
      --ink: rgb(246,246,247);
      --ink-soft: rgb(157,157,161);
      --hair: rgba(246,246,247,0.18);
      --accent: rgb(120,146,255);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: stretch;
  }
  main {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 30px 52px;
    display: flex;
    flex-direction: column;
  }
  h1 {
    font-size: clamp(38px, 12vw, 52px);
    font-weight: 600;
    letter-spacing: -0.028em;
    line-height: 1.02;
    margin-top: 46px;
  }
  h1 em { font-style: normal; color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--hair); margin: 24px 0 16px; }
  p.note { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .spacer { flex: 1; min-height: 40px; }
  a.act {
    display: block;
    text-align: center;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    color: var(--paper);
    background: var(--ink);
    border-radius: 999px;
    padding: 15px 20px;
  }
  a.quiet {
    display: block;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 16px;
  }
</style>
</head>
<body>
<main>
  <h1 id="title">Open it<br><em>in Wantd.</em></h1>
  <hr>
  <p class="note" id="note">This piece lives on a Wantd wishlist. Wantd is invitation only.</p>
  <div class="spacer"></div>
  <a class="act" id="open" href="#">Open in Wantd</a>
  <a class="quiet" href="/">Wantd</a>
</main>
<script>
  (function () {
    var m = location.pathname.match(/^\/i\/([0-9a-fA-F-]{36})\/?$/);
    if (!m) { location.replace('/'); return; }
    var deep = 'wantd://item/' + m[1].toLowerCase();
    document.getElementById('open').setAttribute('href', deep);
    // Universal links carry this straight into the app; this is the path for
    // everyone whose phone landed in the browser instead.
    setTimeout(function () { location.href = deep; }, 60);
  })();
</script>
</body>
</html>
