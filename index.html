<!doctype html>
<html lang="en">

<style>
  :root {
    --paper: rgb(247,247,245);
    --paper-deep: rgb(238,238,235);
    --ink: rgb(20,20,18);
    --ink-soft: rgb(122,120,116);
    --accent: rgb(39,67,214);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: rgb(9,9,9);
      --paper-deep: rgb(20,20,20);
      --ink: rgb(243,242,240);
      --ink-soft: rgb(140,139,136);
      --accent: rgb(99,122,255);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", -apple-system, "SF Pro Text", Arial, sans-serif;
    overflow: hidden;
  }

  /* The board is the page */
  #board {
    position: fixed; inset: 0;
    cursor: grab;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #board.grabbing { cursor: grabbing; }
  #sheet { position: absolute; inset: 0; }
  #world { position: absolute; top: 0; left: 0; will-change: transform; }
  .tile { position: absolute; top: 0; left: 0; }

  /* Figures on paper. No card chrome: the photograph is the object. */
  .fig {
    position: absolute; cursor: pointer; display: block;
    color: inherit; text-decoration: none;
  }
  .fig.lift .ph { transform: scale(1.035); transition: transform 0.25s cubic-bezier(0.16,1,0.3,1); }
  .fig .ph {
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    background: var(--paper-deep);
    box-shadow: inset 0 0 0 0.5px rgba(20,20,18,0.08);
  }
  .fig .ph::after {
    content: ""; position: absolute; inset: 0;
    border-radius: 4px;
    box-shadow: inset 0 0 0 0.5px rgba(20,20,18,0.08);
    pointer-events: none;
  }
  .fig img, .fig .block { width: 100%; display: block; pointer-events: none; }
  .fig .ph > * { transition: transform 0.7s cubic-bezier(0.16,1,0.3,1); }
  .fig .ph { transition: transform 0.25s cubic-bezier(0.16,1,0.3,1); }
  .fig:active .ph { transform: scale(0.985); }
  @media (hover: hover) {
    .fig:hover .ph > * { transform: scale(1.015); }
  }
  .fig.reserved .ph { opacity: 0.55; }
  .cap .kept { display: block; font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  /* Entrance: the masthead prints out of an invisible line; each figure
     settles into place once. Nothing blurs, nothing bounces. */
  .masthead .title { overflow: hidden; }
  .masthead .title span { display: inline-block; }
  @media (prefers-reduced-motion: no-preference) {
    .fig .in, .masthead .in {
      opacity: 0;
      transform: translateY(16px);
      animation: settle 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
      animation-delay: var(--d, 0s);
    }
    .masthead .title span {
      transform: translateY(112%);
      animation: printline 0.85s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }
  }
  @keyframes settle { to { opacity: 1; transform: translateY(0); } }
  /* Safety net: content is never hidden by a stalled animation. */
  .shown .fig .in, .shown .masthead .in {
    opacity: 1 !important; transform: none !important; animation: none !important;
  }
  .shown .masthead .title span { transform: none !important; animation: none !important; }
  @keyframes printline { to { transform: translateY(0); } }

  .cap {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 2px 12px;
    padding-top: 7px;
  }
  .cap .name { flex: 1 1 auto; min-width: 0; }
  .cap .price { margin-left: auto; }
  .cap .name {
    font-size: 12px; font-weight: 500; letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cap .price {
    font-size: 12px; font-weight: 400; color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .cap .price.state { color: var(--accent); font-weight: 500; }
  .cap .name { transition: color 0.18s ease; }
  @media (hover: hover) {
    .fig:hover .cap .name { color: var(--accent); }
  }
  .fig:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 4px; }
  ::selection { background: var(--accent); color: rgb(247,247,245); }

  /* The masthead lives ON the board, dragged like everything else */
  .masthead { position: absolute; pointer-events: none; }

    font-size: 84px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.92;
    text-transform: uppercase;
  }
  .masthead .sub {
    margin-top: 14px;
    font-size: 12px; font-weight: 400; color: var(--ink-soft);
    letter-spacing: 0.01em;
  }
  .masthead .sub b { color: var(--accent); font-weight: 500; }

  /* Fixed chrome: one quiet corner each */
  .corner {
    position: fixed; z-index: 2; pointer-events: none;
    font-size: 11px; font-weight: 500; letter-spacing: 0.02em;
  }
  .corner.brand { right: 26px; bottom: 22px; color: var(--accent); }
  .corner.handle { right: 26px; top: 24px; color: var(--ink-soft); font-weight: 400; }

  /* Index: the magazine's table of contents */
  .indexBtn {
    position: fixed; left: 26px; bottom: 22px; z-index: 3;
    background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.02em;
    color: var(--ink-soft);
    transition: color 0.18s ease;
  }
  .indexBtn:hover { color: var(--accent); }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    pointer-events: none;
  }
  .overlay .scrim {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.42);
    opacity: 0; transition: opacity 0.3s ease;
  }
  .overlay.on { pointer-events: auto; }
  .overlay.on .scrim { opacity: 1; }

  .panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-width: 460px; margin: 0 auto;
    background: var(--paper);
    border-radius: 16px 16px 0 0;
    padding: 20px 24px calc(20px + env(safe-area-inset-bottom));
    max-height: 62vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    transform: translateY(24px); opacity: 0;
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease;
  }
  @media (min-width: 700px) {

  .overlay.on .panel { transform: translateY(0); opacity: 1; }
  .panel .row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 10px 0; cursor: pointer;
  }
  .panel .row .n {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 0.15s ease;
  }
  .panel .row:hover .n { color: var(--accent); }
  .panel .row .p {
    font-size: 12.5px; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .panel .row .p.state { color: var(--accent); font-weight: 500; }

  /* The piece, opened in place */
  .piece {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -46%); opacity: 0;
    width: min(420px, calc(100vw - 32px));
    max-height: 86vh; overflow-y: auto;
    background: var(--paper); border-radius: 16px; overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease;

  .overlay.on .piece { transform: translate(-50%, -50%); opacity: 1; }
  .piece img {

  .piece .info { padding: 18px 22px 22px; }
  .piece .nm { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .piece .pz { margin-top: 5px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .piece .pz.state { color: var(--accent); font-weight: 500; }
  .piece .go {
    margin-top: 16px; display: block; text-align: center;
    background: var(--ink); color: var(--paper); text-decoration: none;

  button.go { width: 100%; border: 0; cursor: pointer; font-family: inherit; }
  .piece .go.quiet {

    background: none; color: var(--ink-soft); font-weight: 400;
    text-decoration: underline; text-underline-offset: 3px;

  .piece .go.quiet:active { transform: none; }
  .piece .resv input {
    width: 100%; margin-top: 14px;
    font: inherit; font-size: 14px; color: var(--ink);
    background: none; border: 0; border-radius: 0;
    border-bottom: 1px solid rgba(127,127,127,0.35);
    padding: 10px 2px; outline: none; -webkit-appearance: none;

  .piece .resv input::placeholder { color: var(--ink-soft); }
  .piece .note { margin-top: 12px; font-size: 12px; line-height: 1.5; color: var(--ink-soft); }
  .piece .appline {
    margin-top: 20px; padding-top: 14px;
    border-top: 1px solid rgba(127,127,127,0.22);
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    font-size: 12px; line-height: 1.45; color: var(--ink-soft);
  }
  .piece .appline a { color: var(--ink); text-decoration: none; font-weight: 500; white-space: nowrap; }

  .empty {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: 13px;
  }

  @media (max-width: 700px) {
    .masthead .title { font-size: 56px; }
  }

// ---------------------------------------------------------------------------
// An exploded magazine spread: a giant masthead and flat photographs, laid on
// one endless sheet of paper. Straight, precise, generous gutters.
// ---------------------------------------------------------------------------
function buildTile(profile, items) {
  const small = Math.min(innerWidth, innerHeight) < 700;
  const W = small ? 168 : 236;
  const GAP_X = small ? 12 : 18;
  const GAP_Y = small ? 18 : 26;
  const CAPTION = 28;
  const MAST_H = small ? 150 : 208;

  // The sheet must be wider and taller than the viewport, otherwise the
  // neighbouring copy shows the same piece beside itself.
  const COLS = Math.max(small ? 4 : 5,
                        Math.ceil((innerWidth * 1.7) / (W + GAP_X)));
  const targetH = innerHeight * 1.7;

  // Deterministic shuffle. Pieces that are the same PRODUCT (saved twice
  // from two shops, or literal repeats) share a family, and a family never
  // appears twice within one row of itself.
  let seed = 20260802;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

  const tokens = items.map(it => new Set(
    it.name.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .split(/[^a-z0-9]+/)
      .filter(w => w.length > 2 && !["the","and","les","des","une","pour"].includes(w))
  ));
  const family = items.map((_, i) => i);
  const find = (a) => family[a] === a ? a : (family[a] = find(family[a]));
  for (let a = 0; a < items.length; a++) {
    for (let b = a + 1; b < items.length; b++) {
      let shared = 0;
      tokens[a].forEach(t => { if (tokens[b].has(t)) shared++; });
      if (shared >= 2) family[find(a)] = find(b);
    }
  }

  function sequence(minCount) {
    const seq = [];
    let pool = [];
    while (seq.length < minCount) {
      if (!pool.length) {
        pool = items.map((it, i) => ({ it, i }));
        for (let k = pool.length - 1; k > 0; k--) {
          const j = Math.floor(rnd() * (k + 1));
          [pool[k], pool[j]] = [pool[j], pool[k]];
        }
      }
      const recent = new Set(seq.slice(-(COLS + 1)).map(e => find(e.i)));
      let pick = pool.findIndex(e => !recent.has(find(e.i)));
      if (pick < 0) pick = 0;
      seq.push(pool.splice(pick, 1)[0]);
    }
    return seq;
  }

  // Rough pass to learn the column height, then build for real.
  const avgRow = W * 1.15 + CAPTION + GAP_Y;
  const perCol = Math.max(Math.ceil(items.length / COLS),
                          Math.ceil(targetH / avgRow));
  const seq = sequence(perCol * COLS);

  const tile = document.createElement("div");
  tile.className = "tile";
  const placements = {};

  const mast = document.createElement("div");
  mast.className = "masthead";
  mast.style.transform = "translate(0px, 0px)";
  mast.style.width = (2 * W + GAP_X) + "px";
  mast.innerHTML =
    `<div class="in" style="--d:0s">` +
    `<div class="title"><span>${profile.name}</span></div>` +
    `<div class="sub"><b>Wishlist</b>, ${items.length} ${items.length === 1 ? "want" : "wants"}</div>` +
    `</div>`;
  tile.append(mast);

  const colY = new Array(COLS).fill(0).map((_, c) =>
    c < 2 ? MAST_H : (c % 2 ? W * 0.34 : W * 0.12));

  seq.forEach((entry, i) => {
    const it = entry.it;
    const col = i % COLS;
    const x = col * (W + GAP_X);
    const y = colY[col];
    colY[col] = y + W * it.ratio + CAPTION + GAP_Y;

    const fig = document.createElement(it.url ? "a" : "figure");
    if (it.url) {
      fig.href = shopURL(it.url);
      fig.target = "_blank";
      fig.rel = "noopener";
      fig.draggable = false;
    }
    fig.className = "fig" + (it.reserved ? " reserved" : "");
    fig.dataset.idx = entry.i;
    fig.style.width = W + "px";
    fig.style.transform = `translate(${x}px, ${y}px)`;
    if (!(entry.i in placements)) placements[entry.i] = { x, y };
    const diag = (col + Math.floor(i / COLS));
    fig.style.setProperty("--d", (0.18 + diag * 0.05).toFixed(2) + "s");

    const ph = document.createElement("div"); ph.className = "ph";
    if (it.img) {
      const img = new Image(); img.src = it.img; img.alt = it.name; ph.append(img);
    } else {
      const b = document.createElement("div"); b.className = "block";
      b.style.paddingBottom = (it.ratio * 100) + "%"; b.style.background = it.tone;
      ph.append(b);
    }
    const cap = document.createElement("figcaption"); cap.className = "cap";
    const nm = document.createElement("span"); nm.className = "name"; nm.textContent = it.name;
    const pr = document.createElement("span");
    pr.className = "price" + (it.reserved ? " state" : "");
    pr.textContent = it.reserved ? "Reserved" : (it.price || "");
    cap.append(nm, pr);
    if (it.keptWith) {
      const kw = document.createElement("span");
      kw.className = "kept";
      kw.textContent = "Kept with " + it.keptWith;
      cap.append(kw);
    }
    const inner = document.createElement("div");
    inner.className = "in";
    inner.append(ph, cap);
    fig.append(inner);
    tile.append(fig);
  });

  return {
    tile,
    tileW: COLS * (W + GAP_X),
    tileH: Math.max(...colY) + GAP_Y,
    W,
    placements,
  };
}

function startBoard(profile, items) {
  document.getElementById("handle").textContent = "@" + profile.handle;

  const world = document.getElementById("world");
  let tileW = 1, tileH = 1, cardW = 1, placements = {};

  // Build enough copies to cover the CURRENT viewport (plus a margin ring),
  // and rebuild whenever it changes; the modulo render does the rest.
  function layout() {
    world.replaceChildren();
    const built = buildTile(profile, items);
    tileW = built.tileW; tileH = built.tileH;
    cardW = built.W; placements = built.placements;
    const nx = Math.ceil(innerWidth / tileW) + 2;
    const ny = Math.ceil(innerHeight / tileH) + 2;
    for (let dx = -1; dx < nx - 1; dx++) for (let dy = -1; dy < ny - 1; dy++) {
      const t = (dx === 0 && dy === 0) ? built.tile : built.tile.cloneNode(true);
      t.style.transform = `translate(${dx * tileW}px, ${dy * tileH}px)`;
      world.append(t);
    }
  }
  layout();
  // If the entrance never got to run (throttled tab, blocked animations),
  // reveal everything rather than show an empty sheet.
  setTimeout(() => {
    const probe = document.querySelector(".fig .in");
    if (probe && parseFloat(getComputedStyle(probe).opacity) < 0.9) {
      document.body.classList.add("shown");
    }
  }, 1800);
  let resizeTimer;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 180);
  });

  // Opening framing: the masthead sits in the upper left, breathing.
  let tx = 40, ty = 60;          // target (the hand)
  let rx = tx, ry = ty;          // rendered (eased toward the hand)
  let vx = 0, vy = 0;            // release momentum
  let downX = 0, downY = 0, downT = 0, moved = 0;
  let dragging = false, lastX = 0, lastY = 0, lastT = 0;
  const board = document.getElementById("board");
  const mod = (v, m) => ((v % m) + m) % m;
  let interacted = false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  board.addEventListener("pointerdown", (e) => {
    dragging = true; board.classList.add("grabbing");
    lastX = downX = e.clientX; lastY = downY = e.clientY;
    lastT = downT = performance.now();
    moved = 0;
    vx = vy = 0;
    hint.classList.add("gone");
  });
  board.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const now = performance.now(), dt = Math.max(1, now - lastT);
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    tx += dx; ty += dy;
    vx = vx * 0.4 + (dx / dt * 16) * 0.6;
    vy = vy * 0.4 + (dy / dt * 16) * 0.6;
    lastX = e.clientX; lastY = e.clientY; lastT = now;
    moved = Math.max(moved, Math.hypot(e.clientX - downX, e.clientY - downY));
    if (moved > 6 && !board.hasPointerCapture(e.pointerId)) {
      board.setPointerCapture(e.pointerId);
    }
  });
  const release = () => { dragging = false; board.classList.remove("grabbing"); };
  board.addEventListener("pointercancel", release);
  board.addEventListener("pointerup", release);
  // A still hand on a piece is a visit; a wander is not a click.
  board.addEventListener("click", (e) => {
    if (moved > 6) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  board.addEventListener("wheel", (e) => {
    e.preventDefault();
    tx -= e.deltaX; ty -= e.deltaY;
    interacted = true;
  }, { passive: false });

  // The only clock: eases the sheet toward the hand and carries momentum.
  (function frame() {
    if (!dragging && (Math.abs(vx) > 0.04 || Math.abs(vy) > 0.04)) {
      tx += vx; ty += vy;
      vx *= 0.93; vy *= 0.93;
    }
    const ease = reduce ? 1 : 0.22;
    rx += (tx - rx) * ease;
    ry += (ty - ry) * ease;
    world.style.transform =
      `translate3d(${mod(rx, tileW) - tileW}px, ${mod(ry, tileH) - tileH}px, 0)`;

    requestAnimationFrame(frame);
  })();

  // --- The index: the wishlist's table of contents -------------------------
  const indexBtn = document.getElementById("indexBtn");
  const indexOverlay = document.getElementById("indexOverlay");
  const indexPanel = document.getElementById("indexPanel");
  const pieceOverlay = document.getElementById("pieceOverlay");
  const pieceCard = document.getElementById("pieceCard");

  items.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "row";
    const n = document.createElement("span"); n.className = "n"; n.textContent = it.name;
    const pr = document.createElement("span");
    pr.className = "p" + (it.reserved ? " state" : "");
    pr.textContent = it.reserved ? "Reserved" : (it.price || "");
    row.append(n, pr);
    row.addEventListener("click", () => {
      indexOverlay.classList.remove("on");
      glideTo(i);
    });
    indexPanel.append(row);
  });

  indexBtn.addEventListener("click", () => indexOverlay.classList.add("on"));
  indexOverlay.querySelector(".scrim").addEventListener("click", () => indexOverlay.classList.remove("on"));
  pieceOverlay.querySelector(".scrim").addEventListener("click", () => pieceOverlay.classList.remove("on"));
  addEventListener("keydown", (e) => {
    if (e.key === "Escape") { indexOverlay.classList.remove("on"); pieceOverlay.classList.remove("on"); }
  });

  // Bring a piece to the center of the screen, by the shortest road.
  function glideTo(i) {
    const pl = placements[i];
    if (!pl) return;
    interacted = true;
    vx = vy = 0;
    const baseX = (innerWidth - cardW) / 2 - pl.x;
    const baseY = innerHeight * 0.42 - pl.y;
    tx = baseX + Math.round((rx - baseX) / tileW) * tileW;
    ty = baseY + Math.round((ry - baseY) / tileH) * tileH;
  }

  // --- The piece, opened in place ------------------------------------------
  // Reserving writes to someone's wishlist, and the key that allows writes
  // cannot live in a public page — so reserving belongs to the app. The web
  // page reads, and sends you to the app to act.
  // Fill this in once the app is on the App Store; until then the card says
  // so plainly rather than offering a dead link.
  const APP_STORE_URL = "https://apps.apple.com/app/id6787658989";

  function openPiece(idx) {
    const it = items[idx];
    let host = "";
    try { host = new URL(it.url).hostname.replace(/^www\./, ""); } catch {}
    pieceCard.replaceChildren();
    if (it.img) {
      const img = new Image(); img.src = it.img; img.alt = it.name;
      pieceCard.append(img);
    }
    const info = document.createElement("div"); info.className = "info";
    pieceCard.append(info);

    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = it.name;
    const pz = document.createElement("div");
    pz.className = "pz" + (it.reserved ? " state" : "");
    pz.textContent = it.reserved ? "Reserved" : (it.price || "");
    info.append(nm, pz);

    if (it.reserved) {
      const note = document.createElement("div"); note.className = "note";
      note.textContent = "Someone has already reserved this gift.";
      info.append(note);
    } else if (APP_STORE_URL) {
      const rs = document.createElement("a");
      rs.className = "go"; rs.href = APP_STORE_URL;
      rs.target = "_blank"; rs.rel = "noopener";
      rs.textContent = "Reserve in the app";
      info.append(rs);
    }

    if (it.url) {
      const go = document.createElement("a");
      go.className = "go quiet"; go.href = shopURL(it.url); go.target = "_blank"; go.rel = "noopener";
      go.textContent = host ? "View at " + host : "View the piece";
      info.append(go);
    }

    const appline = document.createElement("div"); appline.className = "appline";
    const at = document.createElement("span");
    // The button above already carries the link, so this line stays a line.
    at.textContent = APP_STORE_URL
      ? "Group gifts and your own list live in Wantd."
      : "Reserving and group gifts happen in the Wantd app, coming soon.";
    appline.append(at);
    info.append(appline);

    pieceOverlay.classList.add("on");
  }

  board.addEventListener("click", (e) => {
    const fig = e.target.closest ? e.target.closest(".fig") : null;
    if (!fig) return;
    e.preventDefault();
    openPiece(+fig.dataset.idx);
  });

  // --- Guided arrival: one slow half-screen drift, then stillness ----------
  if (!reduce) {
    setTimeout(() => {
      if (interacted) return;
      const dur = 2000, dx = -Math.min(innerWidth * 0.5, 340), dy = -90;
      const t0 = performance.now();
      let applied = 0;
      (function driftStep(now) {
        if (interacted) return;
        const pct = Math.min(1, (now - t0) / dur);
        const eased = 0.5 - 0.5 * Math.cos(Math.PI * pct);
        tx += dx * (eased - applied);
        ty += dy * (eased - applied);
        applied = eased;
        if (pct < 1) requestAnimationFrame(driftStep);
      })(t0);
    }, 1500);
  }
}

// Real product images: measure natural ratios before laying the board out.
// Only the DIMENSIONS are needed, and the browser knows them from the first
// bytes of the file — poll naturalWidth instead of waiting for full loads,
// so the board appears in a fraction of the download time.
function preload(items) {
  return Promise.all(items.map(it => new Promise(resolve => {
    if (!it.img) { resolve({ ...it, ratio: 1.2, tone: "#DDD9D2" }); return; }
    const img = new Image();
    let settled = false;
    const done = (ratio) => {
      if (settled) return;
      settled = true;
      clearInterval(poll); clearTimeout(timer);
      resolve({ ...it, ratio });
    };
    const measure = () => {
      if (img.naturalWidth > 0) {
        const r = img.naturalHeight / Math.max(1, img.naturalWidth);
        done(Math.min(1.6, Math.max(0.72, r)));
      }
    };
    const poll = setInterval(measure, 60);
    const timer = setTimeout(() => done(1.2), 4000);
    img.onload = measure;
    img.onerror = () => {
      if (settled) return;
      settled = true;
      clearInterval(poll); clearTimeout(timer);
      resolve({ ...it, img: null, ratio: 1.2, tone: "#DDD9D2" });
    };
    img.src = it.img;
  })));
}

// ---------------------------------------------------------------------------
// CloudKit, read only. The token is minted in the CloudKit console
// (Tokens & Keys) and only allows what the schema already exposes publicly.
// ---------------------------------------------------------------------------
const CK = {
  container: "iCloud.com.sedonatech.WANTD",
  env: "production",
  token: "81be7b7770829e83e23ba86168bfcda9676868818687c83b269e560a9271bf54"
};

function formatPrice(amount, currency, fallback) {
  if (typeof amount !== "number" || !currency) return fallback;
  try {
    const noCents = ["JPY", "IDR", "KRW", "VND", "CLP", "HUF"].includes(currency.toUpperCase());
    return new Intl.NumberFormat(navigator.language || "en", {
      style: "currency",
      currency: currency,
      minimumFractionDigits: 0,
      maximumFractionDigits: noCents ? 0 : 2
    }).format(amount);
  } catch (e) {
    return fallback;   // an unknown currency code must never blank a price
  }
}

async function ckQuery(query, continuationMarker) {
  const url = "https://api.apple-cloudkit.com/database/1/" + CK.container +
              "/" + CK.env + "/public/records/query?ckAPIToken=" +
              encodeURIComponent(CK.token);
  const body = { query, resultsLimit: 200 };
  if (continuationMarker) body.continuationMarker = continuationMarker;
  const res = await fetch(url, { method: "POST", body: JSON.stringify(body) });
  if (!res.ok) throw new Error("CloudKit " + res.status);
  return res.json();
}

async function loadWishlist(handle) {
  const profRes = await ckQuery({
    recordType: "Profile",
    filterBy: [{ fieldName: "handle", comparator: "EQUALS", fieldValue: { value: handle } }]
  });
  const prof = (profRes.records || []).filter(r => !r.serverErrorCode)[0];
  if (!prof) throw new Error("no profile");
  const pf = prof.fields;
  const profile = {
    name: pf.displayName?.value || handle,
    handle: pf.handle?.value || handle
  };

  // Which of her lists are private. A private list is where people put the
  // things they are a little ashamed of wanting, and nobody is ever meant to
  // see it: not a friend, not a stranger with the link (Agathe, 2026-08-28).
  // The board had no idea private lists existed and published them.
  const privateLists = new Set();
  // Co-owned lists live on every member's board: the other members' pieces
  // on her shared, PUBLIC lists join it (SED-598). Private ones never do.
  const sharedPublicLists = new Set();
  try {
    const listRes = await ckQuery({
      recordType: "List",
      filterBy: [{ fieldName: "ownerID", comparator: "EQUALS",
                   fieldValue: { value: pf.ownerID.value } }]
    });
    for (const r of (listRes.records || []).filter(r => !r.serverErrorCode)) {
      const uuid = r.fields.listUUID?.value;
      if (!uuid) continue;
      if ((r.fields.isPrivate?.value ?? 0) === 1) privateLists.add(uuid);
      else if ((r.fields.memberIDs?.value || []).length) sharedPublicLists.add(uuid);
    }
  } catch (e) {
    // A lookup we could not perform must never be read as "nothing is
    // private": sooner an empty board than a private list on the internet.
    throw new Error("private lists unavailable");
  }
  try {
    // Lists she was invited into, created by someone else. Additive only:
    // if this fails the board is merely incomplete, never leaky.
    const joined = await ckQuery({
      recordType: "List",
      filterBy: [{ fieldName: "memberIDs", comparator: "LIST_CONTAINS",
                   fieldValue: { value: pf.ownerID.value } }]
    });
    for (const r of (joined.records || []).filter(r => !r.serverErrorCode)) {
      const uuid = r.fields.listUUID?.value;
      if (uuid && (r.fields.isPrivate?.value ?? 0) !== 1) sharedPublicLists.add(uuid);
    }
  } catch (e) { /* incomplete, not leaky */ }

  // Who keeps each shared list, so every shared card can say so: a gift on a
  // co-owned list pleases two people, and the giver deserves to know it
  // before buying (same rule as in the app, 2026-08-28).
  const sharedWith = new Map();   // listUUID -> "Agathe" / "Agathe, Sedona"
  try {
    const memberIDsByList = new Map();
    const allMemberIDs = new Set();
    for (const q of [
      { fieldName: "ownerID", comparator: "EQUALS", fieldValue: { value: pf.ownerID.value } },
      { fieldName: "memberIDs", comparator: "LIST_CONTAINS", fieldValue: { value: pf.ownerID.value } }
    ]) {
      const res = await ckQuery({ recordType: "List", filterBy: [q] });
      for (const r of (res.records || []).filter(r => !r.serverErrorCode)) {
        const uuid = r.fields.listUUID?.value;
        if (!uuid || !sharedPublicLists.has(uuid)) continue;
        const ids = new Set(r.fields.memberIDs?.value || []);
        if (r.fields.ownerID?.value) ids.add(r.fields.ownerID.value);
        ids.delete(pf.ownerID.value);
        memberIDsByList.set(uuid, [...ids]);
        for (const id of ids) allMemberIDs.add(id);
      }
    }
    const names = new Map();
    for (const id of allMemberIDs) {
      const res = await ckQuery({
        recordType: "Profile",
        filterBy: [{ fieldName: "ownerID", comparator: "EQUALS", fieldValue: { value: id } }]
      });
      const prof = (res.records || []).filter(r => !r.serverErrorCode)[0];
      if (prof) names.set(id, prof.fields.displayName?.value || prof.fields.handle?.value || "");
    }
    for (const [uuid, ids] of memberIDsByList) {
      const label = ids.map(id => names.get(id)).filter(Boolean).join(", ");
      sharedWith.set(uuid, label || "someone");
    }
  } catch (e) { /* names are a courtesy, never a blocker */ }

  let records = [], marker = null;
  do {
    const page = await ckQuery({
      recordType: "Item",
      filterBy: [{ fieldName: "ownerID", comparator: "EQUALS",
                   fieldValue: { value: pf.ownerID.value } }]
    }, marker);
    records = records.concat((page.records || []).filter(r => !r.serverErrorCode));
    marker = page.continuationMarker || null;
  } while (marker);

  // The co-members' pieces on her shared public lists.
  for (const uuid of sharedPublicLists) {
    try {
      const extra = await ckQuery({
        recordType: "Item",
        filterBy: [{ fieldName: "listIDs", comparator: "LIST_CONTAINS",
                     fieldValue: { value: uuid } }]
      });
      records = records.concat((extra.records || []).filter(r => !r.serverErrorCode));
    } catch (e) { /* incomplete, not leaky */ }
  }
  // One card per record: her own pieces came back in both queries.
  records = [...new Map(records.map(r => [r.recordName, r])).values()];

  const items = records
    .sort((a, b) => (a.fields.sortIndex?.value ?? 0) - (b.fields.sortIndex?.value ?? 0))
    .map(r => {
      const f = r.fields;
      let img = f.imageURLString?.value || null;
      if (!img && f.imageAsset?.value?.downloadURL)
        img = f.imageAsset.value.downloadURL.replace("${f}", "image");
      return {
        name: f.name?.value || "",
        // Same rule as the app: when the numeric amount and its currency are
        // known, format them for the reader; otherwise fall back to the string
        // scraped from the shop. The board used to always show the raw string,
        // so the same piece read "37.99 €" in the app and "€37,99" here
        // (Agathe, 2026-08-28).
        //
        // Deliberately no parsing of the scraped string: "£29.000" is
        // twenty-nine thousand pounds and "37,99" is thirty-seven, and getting
        // that wrong on a gift list is worse than an uneven format.
        price: formatPrice(f.priceAmount?.value, f.priceCurrency?.value,
                           f.priceText?.value || ""),
        img,
        url: f.urlString?.value || "",
        // The board never reveals a reservation. The owner opens her own
        // link too, and reading "Reserved" on her own gift is exactly the
        // surprise we promise to keep (2026-08-24). Reserving lives in the
        // app, where the owner is the one person who cannot see it.
        reserved: false,
        // She marked it as already hers. It leaves the public board exactly
        // as it leaves her wishlist in the app: the board counted 46 where
        // the app counted 43, and kept offering three things she owns
        // (Agathe, 2026-08-28).
        //
        // Only "purchased" is dropped, never "reserved": a reservation is a
        // friend's secret, and making that piece vanish would reveal by its
        // absence exactly what this whole app is built to hide.
        spoiled: (f.status?.value || "") === "purchased",
        // The co-owned list this piece sits on, if any: its card says so.
        keptWith: (f.listIDs?.value || []).map(id => sharedWith.get(id)).find(Boolean) || null,
        // Filed ONLY in private lists, so it stays off the board. A piece in
        // no list at all predates lists and stays visible, exactly as the app
        // decides it.
        hidden: (() => {
          const ids = f.listIDs?.value || [];
          return ids.length > 0 && ids.every(id => privateLists.has(id));
        })(),
        recordName: r.recordName
      };
    })
    .filter(it => it.name && !it.spoiled && !it.hidden);
  if (!items.length) throw new Error("no items");
  return { profile, items };
}

function showEmpty() {
  document.body.insertAdjacentHTML("beforeend",
    '<div class="empty">This wishlist could not be found.</div>');
}

if (!HANDLE) {
  preload(SAMPLE.items).then(items => startBoard(SAMPLE.profile, items));
} else if (CK.token.startsWith("__")) {
  showEmpty();
} else {
  loadWishlist(HANDLE)
    .then(({ profile, items }) => preload(items).then(loaded => startBoard(profile, loaded)))
    .catch(showEmpty);
}
</script>
