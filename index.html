<script>
  // Wantd on the web is the app itself (Agathe, 9 November 2026): the old
  // landing, its invitation and its waitlist are gone, the address opens
  // Wantd. The app lives under /feed/ and stays there: CloudKit JS keeps its
  // session in a cookie whose path is the page's folder, and the sign-in page
  // of the Android app (/feed/connect.html) shares that one cookie.
  // Board, promise and secret santa links still arrive at the root with a
  // query: they go to the board.
  (function () {
    var q = location.search, h = location.hash;
    location.replace((/[?&](handle|promise|santa)=/.test(q) ? '/board/' : '/feed/') + q + h);
  })();
</script>
